paths:
  /api/users:
    get:
      summary: Obtener todos los usuarios
      tags:
        - Users
      responses:
        "200":
          description: Lista de usuarios obtenida correctamente
  
  /api/users/{uid}:
    get:
      summary: Obtener un usuario por ID
      tags: 
        - Users
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string 
      responses:
        "200":
          description: Usuario encontrado
        "404":
          description: Usuario no encontrado